server.port=8083

spring.application.name=rental-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bibliotech_rentals?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bibliotech}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bibliotech}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

bibliotech.jwt.secret=BibliotechSecretKeyForJwtAuthenticationVeryLongSecureKey2026!
bibliotech.rental.default-loan-days=14
bibliotech.internal-service.token=${BIBLIOTECH_INTERNAL_SERVICE_TOKEN:local-development-internal-token-change-me}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

management.endpoints.web.exposure.include=health,info