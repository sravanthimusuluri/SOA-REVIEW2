server.port=8081

spring.application.name=auth-service
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bibliotech_auth?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bibliotech}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bibliotech}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

bibliotech.jwt.secret=BibliotechSecretKeyForJwtAuthenticationVeryLongSecureKey2026!
bibliotech.jwt.expiration-ms=86400000

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info